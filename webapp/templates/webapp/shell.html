{% load static webapp %}<!doctype html>
<html lang="en" class="h-full">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{ meta.title }}</title>
  <meta name="description" content="{{ meta.description }}">
  {% if not meta.indexable %}<meta name="robots" content="noindex">{% endif %}
  <link rel="canonical" href="{{ meta.canonical }}">
  <meta property="og:site_name" content="VenuePulse">
  <meta property="og:type" content="{{ meta.og_type }}">
  <meta property="og:title" content="{{ meta.og_title }}">
  <meta property="og:description" content="{{ meta.og_description }}">
  <meta property="og:url" content="{{ meta.canonical }}">
  <meta property="og:image" content="{{ meta.og_image }}">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#09090f" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="{% static 'venues/img/favicon.svg' %}" type="image/svg+xml">
  <link rel="icon" href="{% static 'venues/img/favicon-32.png' %}" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="{% static 'venues/img/apple-touch-icon.png' %}">
  <link rel="manifest" href="{% url 'manifest' %}">
  <link rel="alternate" type="application/atom+xml" title="Upcoming deadlines" href="{% url 'venues:atom_feed' %}">
  <script nonce="{{ csp_nonce }}">
    (function () {
      try {
        var t = localStorage.getItem('vp-theme') || 'system';
        var dark = t === 'dark' || (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      } catch (e) {}
    })();
  </script>
  {% vite_assets page_module %}
  {% for block in meta.jsonld %}{% jsonld block %}{% endfor %}
</head>
<body class="min-h-full bg-background font-sans text-foreground antialiased">
  <div id="root">
    <div class="flex min-h-screen flex-col" aria-busy="true">
      <header class="sticky top-0 z-40 border-b border-border/70 bg-background/80 backdrop-blur-xl">
        <div class="mx-auto flex h-14 max-w-screen-2xl items-center gap-3 px-4 sm:px-6 lg:px-8">
          <a href="/" class="flex items-center gap-2.5 font-semibold tracking-tight">
            <span class="grid h-8 w-8 place-items-center rounded-lg bg-gradient-to-br from-indigo-500 to-violet-600 text-white shadow-sm shadow-indigo-500/30">
              <svg viewBox="0 0 24 24" class="h-[18px] w-[18px]" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg>
            </span>
            <span class="text-[15px]">VenuePulse</span>
          </a>
        </div>
      </header>
      <main class="mx-auto w-full max-w-screen-2xl flex-1 px-4 py-10 sm:px-6 lg:px-8">
        <h1 class="sr-only">{{ meta.og_title }}</h1>
        <div class="h-1 w-40 overflow-hidden rounded-full bg-muted"><div class="h-full w-1/3 animate-pulse rounded-full bg-primary/60"></div></div>
      </main>
    </div>
  </div>
  <noscript>
    <div class="mx-auto max-w-2xl px-6 py-10">
      <h1 class="text-2xl font-semibold">{{ meta.og_title }}</h1>
      <p class="mt-3 text-muted-foreground">{{ meta.description }}</p>
      <p class="mt-6">VenuePulse is an interactive app and needs JavaScript. The catalogue is also available as
        <a class="underline" href="{% url 'venues:export_csv' %}">CSV</a>, <a class="underline" href="{% url 'venues:export_json' %}">JSON</a>,
        an <a class="underline" href="{% url 'venues:atom_feed' %}">Atom feed</a> and a <a class="underline" href="{% url 'venues:api_venues' %}">JSON API</a>.</p>
    </div>
  </noscript>
  {{ boot|json_script:"vp-boot" }}
</body>
</html>
