<li id="item-{{ item.pk }}"><label class="flex cursor-pointer items-start gap-2 py-1 text-sm">
  <input type="checkbox" {% if item.done %}checked{% endif %} hx-post="{% url 'tracker:checklist_toggle' item.submission_id item.pk %}" hx-target="#item-{{ item.pk }}" hx-swap="outerHTML" class="mt-1">
  <span class="{% if item.done %}text-slate-400 line-through{% endif %}">{{ item.text }}</span></label></li>
