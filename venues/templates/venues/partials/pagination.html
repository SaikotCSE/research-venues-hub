{% if page_obj.paginator.num_pages > 1 %}
<nav class="mt-6 flex flex-wrap items-center justify-center gap-2 text-sm" aria-label="Pagination">
  {% if page_obj.has_previous %}
  <a class="btn-secondary" href="?{{ querystring }}&amp;page={{ page_obj.previous_page_number }}" hx-get="{% url 'venues:list' %}?{{ querystring }}&amp;page={{ page_obj.previous_page_number }}" hx-target="#results" hx-push-url="true"
     @click="$nextTick(() => document.getElementById('results-top')?.scrollIntoView({behavior: 'smooth'}))">{% icon "arrow-left" "h-4 w-4" %}Previous</a>
  {% endif %}
  <span class="muted px-2">Page <strong class="text-slate-800 dark:text-slate-100">{{ page_obj.number }}</strong> of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}
  <a class="btn-secondary" href="?{{ querystring }}&amp;page={{ page_obj.next_page_number }}" hx-get="{% url 'venues:list' %}?{{ querystring }}&amp;page={{ page_obj.next_page_number }}" hx-target="#results" hx-push-url="true"
     @click="$nextTick(() => document.getElementById('results-top')?.scrollIntoView({behavior: 'smooth'}))">Next{% icon "chevron-right" "h-4 w-4" %}</a>
  {% endif %}
</nav>
{% endif %}
