{% if page_obj.paginator.num_pages > 1 %}
<nav class="mt-5 flex items-center justify-center gap-3 text-sm" aria-label="Pagination">
  {% if page_obj.has_previous %}<a class="rounded-md border border-slate-300 px-3 py-1.5 hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800" href="?{{ querystring }}&page={{ page_obj.previous_page_number }}" hx-get="{% url 'venues:list' %}?{{ querystring }}&page={{ page_obj.previous_page_number }}" hx-target="#results" hx-push-url="true">← Previous</a>{% endif %}
  <span class="text-slate-500">Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
  {% if page_obj.has_next %}<a class="rounded-md border border-slate-300 px-3 py-1.5 hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800" href="?{{ querystring }}&page={{ page_obj.next_page_number }}" hx-get="{% url 'venues:list' %}?{{ querystring }}&page={{ page_obj.next_page_number }}" hx-target="#results" hx-push-url="true">Next →</a>{% endif %}
</nav>
{% endif %}
