<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Something went wrong · VenuePulse{% endblock %}</title>
  <meta name="robots" content="noindex">
  <style>
    :root { color-scheme: light dark; --bg: #fafafa; --card: #ffffff; --fg: #18181b; --muted: #71717a; --border: #e4e4e7; --accent: #4f46e5; }
    @media (prefers-color-scheme: dark) { :root { --bg: #09090f; --card: #111118; --fg: #f4f4f5; --muted: #a1a1aa; --border: #27272a; --accent: #818cf8; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--fg);
           font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { width: 100%; max-width: 480px; padding: 40px 32px; text-align: center; background: var(--card); border: 1px solid var(--border); border-radius: 16px;
           box-shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 12px 32px -12px rgba(0, 0, 0, .12); }
    .mark { display: inline-grid; place-items: center; width: 40px; height: 40px; border-radius: 10px; background: linear-gradient(135deg, #6366f1, #7c3aed); color: #fff; }
    .code { margin: 20px 0 0; font-size: 13px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); }
    h1 { margin: 6px 0 0; font-size: 26px; line-height: 1.2; letter-spacing: -.02em; }
    p.msg { margin: 12px 0 0; color: var(--muted); }
    a.btn { display: inline-block; margin-top: 28px; padding: 10px 18px; border-radius: 10px; background: var(--accent); color: #fff; font-weight: 600; text-decoration: none; }
    a.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-2.48a2 2 0 0 0-1.93 1.46l-2.35 8.36a.25.25 0 0 1-.48 0L9.24 2.18a.25.25 0 0 0-.48 0l-2.35 8.36A2 2 0 0 1 4.49 12H2"/></svg></span>
    <p class="code">{% block code %}{% endblock %}</p>
    <h1>{% block heading %}{% endblock %}</h1>
    <p class="msg">{% block message %}{% endblock %}</p>
    <a class="btn" href="/">Back to VenuePulse</a>
  </main>
</body>
</html>
