{% extends "venues/base.html" %}
{% block title %}{{ error_title }} · VenuePulse{% endblock %}
{% block content %}
<section class="mx-auto max-w-xl py-16 text-center">
  <p class="text-sm font-semibold uppercase tracking-widest text-brand-600 dark:text-brand-400">{% block code %}{% endblock %}</p>
  <h1 class="mt-2 text-3xl font-bold tracking-tight sm:text-4xl">{% block heading %}{% endblock %}</h1>
  <p class="muted mt-4">{% block message %}{% endblock %}</p>
  <div class="mt-8 flex flex-wrap justify-center gap-3">
    <a href="{% url 'venues:list' %}" class="btn-primary">{% icon "search" "h-4 w-4" %}Explore venues</a>
    <button type="button" class="btn-secondary" @click="$dispatch('open-palette')">{% icon "keyboard" "h-4 w-4" %}Open search</button>
  </div>
</section>
{% endblock %}
