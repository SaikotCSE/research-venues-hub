# Production-like local stack: Django (gunicorn) + PostgreSQL + Redis + an hourly reminder job.
#   cp .env.example .env   # then edit DJANGO_SECRET_KEY
#   docker compose up --build
#   open http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: venuepulse
      POSTGRES_USER: venuepulse
      POSTGRES_PASSWORD: venuepulse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U venuepulse -d venuepulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://venuepulse:venuepulse@db:5432/venuepulse
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "1"
      SEED_VENUES: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  scheduler:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://venuepulse:venuepulse@db:5432/venuepulse
      REDIS_URL: redis://redis:6379/0
      RUN_MIGRATIONS: "0"
    command: ["sh", "-c", "while true; do python manage.py send_reminders; python manage.py send_digest --if-due; sleep 3600; done"]
    healthcheck:
      disable: true
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
